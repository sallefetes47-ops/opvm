# /etc/systemd/journald@opvm.conf.d/00-opvm.conf
# ضبط تدوير سجلات journald الخاصة بخدمة opvm لتجنّب امتلاء القرص
[Journal]
# الحد الأقصى لحجم السجلات على القرص
SystemMaxUse=500M
# الحد الأدنى من المساحة الحرة التي يجب أن تبقى على القرص
SystemKeepFree=1G
# الحد الأقصى لحجم ملف سجل واحد قبل التدوير
SystemMaxFileSize=50M
# الاحتفاظ بالسجلات لمدة 30 يوماً كحد أقصى
MaxRetentionSec=30day
# التدوير كل أسبوع على الأقل
MaxFileSec=1week
# ضغط السجلات القديمة
Compress=yes
# التخزين على القرص (وليس فقط في الذاكرة)
Storage=persistent
ForwardToSyslog=no
