<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>OPVM</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #0F172A; overflow: hidden;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .wrap {
      position: relative; height: 100%; width: 100%;
      background: url('./splash.png') center/cover no-repeat;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 28px; box-sizing: border-box;
    }
    .bar {
      width: 60%; height: 4px; background: rgba(212,175,55,0.2);
      border-radius: 2px; overflow: hidden; margin-bottom: 10px;
    }
    .bar > span {
      display: block; height: 100%; width: 30%;
      background: linear-gradient(90deg, #D4AF37, #f5d77a);
      animation: slide 1.6s ease-in-out infinite;
    }
    .ver { color: #D4AF37; font-size: 12px; opacity: 0.85; }
    @keyframes slide {
      0%   { margin-right: -30%; }
      100% { margin-right: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span></span></div>
    <div class="ver">الإصدار 1.0.0</div>
  </div>
</body>
</html>
