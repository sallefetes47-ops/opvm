<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام المعلومات الجغرافية - المسح العقاري لوادي مزاب</title>
  <meta name="description" content="تطبيق GIS متقدم للمسح العقاري - ولاية غرداية - وادي مزاب" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Google Fonts - Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <h2 class="loading-title">نظام المعلومات الجغرافية</h2>
      <p class="loading-subtitle">جارٍ تحميل بيانات المسح العقاري...</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="loading-stats" id="loadingStats">تهيئة النظام...</p>
    </div>
  </div>

  <!-- Main Application -->
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="logo-area">
          <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 2L37 12V28L20 38L3 28V12L20 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
              <path d="M20 8L31 14V26L20 32L9 26V14L20 8Z" fill="currentColor" opacity="0.3"/>
              <circle cx="20" cy="20" r="4" fill="currentColor"/>
              <line x1="20" y1="2" x2="20" y2="38" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
              <line x1="3" y1="12" x2="37" y2="28" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
              <line x1="37" y1="12" x2="3" y2="28" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
            </svg>
          </div>
          <div class="logo-text">
            <h1>GIS وادي مزاب</h1>
            <span class="logo-badge">المسح العقاري</span>
          </div>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="إخفاء/إظهار الشريط">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <!-- Controls Section -->
      <div class="sidebar-body">
        
        <!-- Municipality Filter -->
        <div class="control-group">
          <label class="control-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            البلدية
          </label>
          <div class="select-wrapper">
            <select id="communeSelect" class="form-select">
              <option value="">— جميع البلديات —</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>

        <!-- Section Search -->
        <div class="control-group">
          <label class="control-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            رقم القسم (Section)
          </label>
          <div class="search-input-wrapper">
            <input type="number" id="sectionInput" class="form-input" placeholder="أدخل رقم القسم..." min="1" />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </div>

        <!-- Ilot Search -->
        <div class="control-group">
          <label class="control-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
              <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
            </svg>
            رقم القطعة (Ilot)
          </label>
          <div class="search-input-wrapper">
            <input type="number" id="ilotInput" class="form-input" placeholder="أدخل رقم القطعة..." min="1" />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </div>

        <!-- Search Button -->
        <button class="btn-search" id="searchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          بحث
        </button>

        <!-- Reset Button -->
        <button class="btn-reset" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          إعادة تعيين
        </button>

        <div class="divider"></div>

        <!-- Statistics Section -->
        <div class="stats-section">
          <h3 class="stats-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            إحصائيات
          </h3>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-value" id="totalFeatures">0</span>
              <span class="stat-label">إجمالي القطع</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="visibleFeatures">0</span>
              <span class="stat-label">القطع المعروضة</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="totalCommunes">0</span>
              <span class="stat-label">عدد البلديات</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="totalArea">0</span>
              <span class="stat-label">المساحة (م²)</span>
            </div>
          </div>
        </div>

      </div>
      
      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <p>ولاية غرداية — وادي مزاب</p>
        <p class="version">الإصدار 2.0</p>
      </div>
    </aside>

    <!-- Map Container -->
    <main class="map-wrapper">
      <div id="map" class="map-container"></div>
      
      <!-- Map Controls Overlay -->
      <div class="map-controls-overlay">
        <button class="map-btn" id="zoomAllBtn" title="عرض الكل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
        <button class="map-btn" id="toggleLabelsBtn" title="إظهار/إخفاء التسميات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"/>
            <line x1="9" y1="20" x2="15" y2="20"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
        </button>
      </div>

      <!-- Feature Detail Panel -->
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <h3>تفاصيل القطعة</h3>
          <button class="detail-close" id="detailClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="detail-body" id="detailBody">
          <!-- Dynamic content -->
        </div>
        <div class="detail-footer">
          <button class="btn-export" id="exportBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            تصدير JSON
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
